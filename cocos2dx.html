<!doctype html>
<html lang="en-IE">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocos2D-X</title>

    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>

<body>
    <div id="app">
        <header class="topbar">
            <nav class="topnav container" aria-label="Primary">
                <a v-for="item in menuItems" :key="item.name" :href="item.url" class="nav-link"
                    :class="{ active: isActive(item) }" :title="item.title">{{ item.name }}</a>
            </nav>
        </header>

        <main class="container page-content">
            <section class="page-panel">
                <h1>Cocos2D-X Projects</h1>
                <p>Cocos2D-X games, prototypes, and experiments.</p>
            </section>

            <section class="page-panel" style="margin-top:1rem;">
                <h2>Featured</h2>
                <p>Cocos2D-X project content/cards placeholder.</p>
            </section>
        </main>

        <site-footer></site-footer>
    </div>

    <script src="./components/SiteFooter.js"></script>
    <script src="./app.js"></script>
</body>

</html>
